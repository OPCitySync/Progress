<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City/Sync — Documentation</title>
  <meta name="description" content="City/Sync documentation hub for foundation, pilot, technical, legal, and FAQ resources." />
  <link rel="icon" href="/brand/citysync-symbol-dark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #fcfaf4;
      --bg-soft: #f4efe4;
      --paper: #ffffff;
      --ink: #213238;
      --ink-soft: #4d6067;
      --brand-blue: #15151e;
      --brand-gold: #dd9e33;
      --line: #dfd7c7;
      --radius-xl: 28px;
      --radius-lg: 18px;
      --shadow-lg: 0 26px 70px rgba(31, 50, 56, 0.14);
      --shadow-md: 0 12px 30px rgba(31, 50, 56, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, var(--bg) 0%, #fffdf8 38%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1240px, 94vw);
      margin-inline: auto;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--brand-blue);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-row {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1rem;
    }

    .brand-nav {
      gap: 0;
      font-size: 0;
      font-weight: 400;
    }

    .brand-wordmark {
      height: 34px;
      width: auto;
      display: block;
    }

    .header-label {
      color: var(--brand-gold);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .docs-main {
      padding: clamp(22px, 3vw, 34px) 0 clamp(66px, 8vw, 94px);
    }

    .docs-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: clamp(18px, 2vw, 26px);
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 96px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(33, 50, 56, 0.12);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 14px;
      max-height: calc(100vh - 130px);
      overflow: auto;
    }

    .search-wrap {
      position: sticky;
      top: -14px;
      z-index: 2;
      margin: -14px -14px 10px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.9));
      border-bottom: 1px solid rgba(33, 50, 56, 0.08);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
    }

    .search-wrap input {
      width: 100%;
      border: 1px solid rgba(33, 50, 56, 0.2);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.94rem;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--brand-gold);
      box-shadow: 0 0 0 3px rgba(221, 158, 51, 0.14);
    }

    .tree-node + .tree-node {
      margin-top: 3px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      border-radius: 9px;
    }

    .tree-row:hover {
      background: rgba(244, 239, 228, 0.72);
    }

    .tree-toggle {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      border-radius: 6px;
      cursor: pointer;
      flex: 0 0 auto;
      position: relative;
    }

    .tree-toggle::before {
      content: "▸";
      display: block;
      line-height: 1;
      font-size: 0.8rem;
      transform: translateY(1px);
      transition: transform 0.15s ease;
    }

    .tree-toggle.is-open::before {
      transform: rotate(90deg) translateY(0);
      transform-origin: center;
    }

    .tree-label {
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 0.9rem;
      text-align: left;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
    }

    .tree-label.group {
      font-weight: 700;
      color: #2d4047;
    }

    .tree-label.selected {
      background: rgba(221, 158, 51, 0.14);
      color: #7a4f10;
      box-shadow: inset 0 0 0 1px rgba(221, 158, 51, 0.35);
    }

    .tree-children {
      margin-top: 2px;
    }

    .no-results {
      color: var(--ink-soft);
      font-size: 0.9rem;
      padding: 10px;
    }

    .content-col {
      min-width: 0;
    }

    .title-card,
    .content-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(33, 50, 56, 0.12);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: clamp(18px, 2.8vw, 30px);
    }

    .content-card {
      margin-top: 14px;
    }

    .content-card.cards-layout {
      display: grid;
      gap: 14px;
    }

    .doc-path {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .doc-title {
      margin: 0;
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .doc-summary {
      margin: 12px 0 0;
      color: var(--ink-soft);
      max-width: 80ch;
      font-size: 1.02rem;
    }

    .doc-section + .doc-section {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px dashed rgba(33, 50, 56, 0.18);
    }

    .content-card.cards-layout .doc-section {
      margin: 0;
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid rgba(33, 50, 56, 0.1);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 30px rgba(26, 31, 54, 0.06);
    }

    .content-card.cards-layout .doc-section + .doc-section {
      margin-top: 0;
      padding-top: 18px;
      border-top: 1px solid rgba(33, 50, 56, 0.1);
    }

    .doc-section h3 {
      margin: 0 0 9px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
    }

    .doc-section p {
      margin: 0;
      color: var(--ink-soft);
    }

    .doc-section p + p {
      margin-top: 10px;
    }

    .doc-list {
      margin: 10px 0 0;
      padding-left: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .doc-list li {
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 10px;
      align-items: start;
      color: var(--ink-soft);
    }

    .doc-list li::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 6px;
      background: linear-gradient(120deg, var(--brand-gold), #f3d596);
      box-shadow: 0 0 0 3px rgba(221, 158, 51, 0.12);
    }

    .doc-link-list {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .doc-link-list a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-weight: 600;
    }

    .doc-link-list a::before {
      content: "↗";
      color: var(--brand-gold);
      font-size: 0.8rem;
    }

    .doc-link-list a:hover {
      color: #7a4f10;
    }

    .doc-actions {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px dashed rgba(33, 50, 56, 0.18);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .doc-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(33, 50, 56, 0.14);
      background: rgba(255, 255, 255, 0.95);
      color: var(--brand-blue);
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .doc-action-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(221, 158, 51, 0.45);
      color: var(--brand-gold);
    }

    .footer {
      padding: 38px 0 44px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
      background: var(--brand-blue);
    }

    .footer-row {
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .links a:hover { color: var(--brand-gold); }

    @media (max-width: 1000px) {
      .docs-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav-row">
      <a class="brand brand-nav" href="/" aria-label="City/Sync Home">
        <img class="brand-wordmark" src="/brand/citysync-wordmark-light.svg" alt="City/Sync" />
      </a>
      <div class="header-label">Documentation</div>
    </div>
  </header>

  <main class="docs-main">
    <div class="container docs-layout">
      <aside class="sidebar" aria-label="Documentation Navigation">
        <div class="search-wrap">
          <input id="doc-search" type="search" placeholder="Search docs, sections, keywords..." aria-label="Search documentation" />
        </div>
        <div id="doc-tree"></div>
      </aside>

      <section class="content-col" aria-live="polite">
        <article class="title-card">
          <div id="doc-path" class="doc-path"></div>

          <p id="doc-summary" class="doc-summary"></p>

        <article id="doc-content" class="content-card"></article>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-row">
      <a class="brand brand-nav" href="/" aria-label="City/Sync Home">
        <img class="brand-wordmark" src="/brand/citysync-wordmark-light.svg" alt="City/Sync" />
      </a>
      <div>© City/Sync. A nonprofit 501(c)3.</div>
      <div class="links">
        <a href="https://x.com/city_sync_" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://discord.gg/ywzxhNQk6w" target="_blank" rel="noopener noreferrer">Discord</a>
        <a href="mailto:city-sync@pm.me">Email</a>
        <a href="https://paragraph.com/@city-sync" target="_blank" rel="noopener noreferrer">Essays</a>

  <script>
    const DOCS_TREE = [
      {
        id: "foundation",
        title: "City/Sync Foundation",
        children: [
          {
            id: "foundation-who-we-are",
            title: "Who We Are",
            keywords: ["foundation", "nonprofit", "who we are", "city sync foundation", "research", "public administration"],
            summary:
              "The City/Sync Foundation is the nonprofit organization responsible for developing, stewarding, and advancing the broader City/Sync ecosystem. It exists to build the protocol, research decentralized public administration frameworks, and help governments adopt digital coordination infrastructure in ways that are practical, governed, and publicly accountable.",
            sections: [
              {
                heading: "Overview",
                paragraphs: [
                  "The City/Sync Foundation is the nonprofit entity behind the City/Sync ecosystem. Its work is broader than a single application or pilot deployment. The Foundation exists to develop programmable coordination infrastructure, study how decentralized public administration frameworks can evolve, and help governments and public institutions integrate digital coordination systems into real administrative processes and procedures.",
                  "In practice, that means the Foundation sits at the intersection of research, infrastructure development, standards creation, and public-sector implementation support. It is not simply operating an app. It is helping define the conditions under which cities can treat civic capacity as something visible, governable, and operational."
                ]
              },
              {
                heading: "What the Foundation Is Responsible For",
                bullets: [
                  "Developing and stewarding the City/Sync Protocol as a public-interest coordination framework.",
                  "Researching the advancement of decentralized public administration frameworks and related governance models.",
                  "Designing deployment pathways that allow public institutions to adopt coordination infrastructure without administrative disruption.",
                  "Working with governments, public-service organizations, and aligned institutions to integrate digital coordination systems into real-world processes.",
                  "Producing documentation, standards, and implementation artifacts that make replication possible across jurisdictions."
                ]
              },
              {
                heading: "What We Are Building vs. What We Do",
                paragraphs: [
                  "A useful distinction is this: the protocol is what we are building, while the Foundation is the organization doing the building, research, stewardship, and implementation support around it. The protocol includes the roles, rules, technical systems, governance patterns, and economic logic that make programmable coordination possible. The Foundation exists to develop and advance that infrastructure responsibly.",
                  "As a nonprofit organization, the Foundation's job is not only to launch tools. It is also to study how those tools interact with public administration, improve them through real-world use, help institutions adopt them in responsible ways, and create the open standards and implementation patterns that let them endure beyond any single pilot."
                ]
              },
              {
                heading: "Why a Foundation Structure Matters",
                paragraphs: [
                  "City/Sync is not being developed as a conventional software product alone because the challenge it addresses is not purely technical. It sits inside public administration, civic governance, institutional trust, and long-term coordination capacity. A nonprofit structure makes it possible to prioritize public-interest design, governance legitimacy, research depth, and institutional adoption over short-term extraction or narrow product optimization.",
                  "That structure also matters for public trust. Governments, public agencies, nonprofits, and communities are more likely to engage deeply with a coordination framework when they can see that the organization behind it is designed to steward the system, not simply monetize access to it."
                ]
              }
            ]
          },
          {
            id: "foundation-mission",
            title: "Mission",
            keywords: ["foundation mission", "mission", "programmable coordination", "public administration", "open standards"],
            summary:
              "The Foundation's mission is to design, develop, deploy, and study programmable coordination systems that allow cities to organize civic contribution through accessible, rule-based infrastructure, while advancing the research and standards needed to integrate those systems into public administration over time.",
            sections: [
              {
                heading: "Mission Statement",
                paragraphs: [
                  "City/Sync designs and deploys programmable coordination systems that allow cities to organize and measure civic contributions through accessible, rule-based infrastructure. Through real-world implementation and research, we study how distributed civic participation can be integrated into public administration and work to develop open standards for coordinating civic capacity at scale.",
                  "Put more simply, the Foundation exists to help cities and communities make civic contribution visible, valuable, and integrable into real public and community pathways."
                ]
              },
              {
                heading: "What the Mission Requires in Practice",
                bullets: [
                  "Building coordination infrastructure that public institutions can actually use.",
                  "Running real-world pilots and deployments that generate operational learning rather than abstract theory alone.",
                  "Studying how distributed civic participation can be governed and administered inside public institutions.",
                  "Developing standards, procedures, and implementation models that other cities can adopt.",
                  "Supporting the long-term evolution of digital coordination systems that remain legible, governed, and publicly accountable."
                ]
              },
              {
                heading: "Why This Mission Matters",
                paragraphs: [
                  "The world already contains enormous quantities of civic effort, care, volunteering, mutual aid, and informal public contribution. But most institutions still struggle to recognize, coordinate, validate, and build upon that effort in durable ways. The Foundation's mission exists to close that gap.",
                  "That means our mission is not just to create better digital tools. It is to help create a new category of public coordination infrastructure that allows civic contribution to become measurable, governable, and usable inside the work of cities and public-service institutions."
                ]
              }
            ]
          },
          {
            id: "foundation-vision",
            title: "Vision",
            keywords: ["foundation vision", "vision", "living coordination networks", "interoperable cities", "dpans"],
            summary:
              "The Foundation's vision is for cities to evolve into living coordination networks: places where public administration becomes more participatory, measurable, and adaptive, and where communities can contribute to public value through interoperable civic systems rather than through fragmented informal effort alone.",
            sections: [
              {
                heading: "Vision Statement",
                paragraphs: [
                  "We envision cities where public administration evolves from a closed bureaucratic process into a participatory, measurable system of collective action. In this model, civic work becomes visible, accountable, and integrated directly into the functioning of public institutions.",
                  "Residents can contribute to their communities through structured civic pathways, institutions can coordinate distributed effort with greater ease, and governance systems can adapt more responsively to public need."
                ]
              },
              {
                heading: "The Long-Term Future We Are Working Toward",
                paragraphs: [
                  "Over time, the Foundation wants to help enable cities to become continuous coordination networks rather than institutions that only mobilize participation episodically. In that future, communities are not treated as outside observers of administration. They become part of a governed and measurable layer of public capacity.",
                  "This is also where decentralized public administration frameworks matter. The goal is not decentralization for its own sake. The goal is to develop administrative models that allow distributed civic participation, institutional authority, and transparent governance to function together in ways that are more adaptive than the systems cities rely on today."
                ]
              },
              {
                heading: "A Global Commons of Civic Coordination",
                paragraphs: [
                  "The Foundation's vision extends beyond one city or one pilot. We envision a future in which cities connected through City/Sync and related frameworks can share coordination models, governance patterns, and public innovations across jurisdictions.",
                  "In that future, interoperable civic systems form a commons-based network for producing public value. Cities do not need to begin from zero each time they want to improve participation infrastructure. They can inherit, adapt, and improve shared models over time."
                ]
              },
              {
                heading: "Why the Vision Is Institutional, Not Just Technical",
                paragraphs: [
                  "This vision is as much about public institutions as it is about software. A digital coordination layer only matters if it changes how institutions can work with civic energy in durable, trusted, and operationally meaningful ways.",
                  "That is why the Foundation's vision includes infrastructure, governance, research, and administrative adoption together. We are not aiming for an app that briefly increases participation. We are aiming for a future in which cities can govern civic capacity as part of how they operate."
                ]
              }
            ]
          },
          {
            id: "foundation-what-we-offer",
            title: "What We Offer",
            keywords: ["foundation offerings", "what we offer", "protocol development", "research", "government integration", "implementation support"],
            summary:
              "The Foundation offers more than software. It provides protocol development, research, implementation support, public-sector collaboration, and the standards work needed to help cities adopt digital coordination infrastructure responsibly.",
            sections: [
              {
                heading: "Protocol Development",
                paragraphs: [
                  "The Foundation develops and stewards the City/Sync Protocol itself: the roles, rules, economic structures, governance patterns, and technical systems that make programmable coordination possible. This includes maintaining the conceptual and operational logic of the ecosystem as it matures through research and deployment.",
                  "In other words, one of our primary offerings is the protocol as public-interest infrastructure."
                ]
              },
              {
                heading: "Research and Framework Development",
                paragraphs: [
                  "The Foundation researches decentralized public administration frameworks, digital coordination models, and the institutional conditions required to make them workable in practice. This work is not separate from deployment. It is strengthened by it.",
                  "We study how cities can organize, govern, and measure distributed civic participation, and we use those findings to refine both the protocol and the broader theory of what future administrative systems can become."
                ]
              },
              {
                heading: "Government and Institutional Integration Support",
                paragraphs: [
                  "A major part of the Foundation's work is helping governments and public-serving institutions integrate digital coordination infrastructure into existing workflows, governance structures, and service systems. That includes onboarding logic, administrative design, role definition, governance support, and the development of implementation blueprints.",
                  "The goal is to make adoption legible and practical. We are not asking institutions to discard everything they already do. We are helping them extend existing systems with new coordination capacity."
                ]
              },
              {
                heading: "Pilot and Deployment Models",
                paragraphs: [
                  "The Foundation offers deployment models that help cities and institutions test programmable coordination under real conditions. These pilots generate the operational precedent that public-sector adoption requires.",
                  "They also produce the documentation, governance patterns, and implementation artifacts needed to turn one deployment into a repeatable model for other jurisdictions."
                ]
              },
              {
                heading: "Open Standards and Public Knowledge",
                paragraphs: [
                  "Another core offering is the development of open standards, public documentation, and reusable implementation knowledge. If programmable coordination is going to become a real administrative category, cities need more than software. They need shared language, shared procedures, and legible pathways for adoption.",
                  "The Foundation helps build that shared base so that public coordination infrastructure can become more portable, more understandable, and more durable across time."
                ]
              },
              {
                heading: "Who These Offerings Are For",
                bullets: [
                  "Local governments and public agencies seeking better ways to integrate civic contribution into public administration.",
                  "Nonprofits and public-service organizations that want more durable coordination infrastructure.",
                  "Researchers and practitioners exploring decentralized public administration frameworks.",
                  "Mission-aligned institutions that want to help develop future public coordination systems in responsible ways."
                ]
              }
            ]
          }
        ]
      },
      {
        id: "pilot",
        title: "City/Sync Pilot Program",
        children: [
          {
            id: "pilot-overview",
            title: "Pilot Program Overview",
            keywords: ["pilot", "overview", "deployment model", "programmable public coordination", "berkeley", "mexico city"],
            summary:
              "The City/Sync Pilot Program is a deployment model for programmable public coordination. Its purpose is to demonstrate how institutional authority, structured civic participation, and governed redemption pathways can operate inside a unified administrative environment while remaining legible, governable, and replicable across cities.",
            sections: [
              {
                heading: "Overview",
                paragraphs: [
                  "The City/Sync Pilot Program establishes a deployment model through which cities can onboard into programmable public coordination infrastructure. It is designed to show how institutional authority and structured civic participation can operate within a unified administrative environment while remaining governable and replicable.",
                  "The pilot is meant to produce operational precedent. It introduces the procedural, economic, social, and governance conditions required for cities to coordinate participation as a functional component of public service ecosystems rather than as an informal or peripheral activity.",
                  "This page outlines the design logic, deployment structure, governance model, and evaluation criteria that guide the pilot. Its purpose is not only to describe a concept, but to define a working model that other jurisdictions can assess and implement."
                ]
              },
              {
                heading: "The Purpose of the Pilot",
                paragraphs: [
                  "The pilot is designed to confirm that programmable public coordination can function under real administrative conditions. It seeks to show that a new coordination layer can be adopted inside existing institutional environments without requiring structural disruption to public governance.",
                  "The proposed framework is structured to operate across two distinct governance contexts: Berkeley, California and Mexico City, Mexico. The goal is to validate that a shared coordination model can function across varied institutional conditions while maintaining operational coherence."
                ]
              },
              {
                heading: "The Four Objectives of Deployment",
                bullets: [
                  "Establish a repeatable municipal onboarding process.",
                  "Validate participation issuance and service redemption mechanisms and processes.",
                  "Validate the concept of Mass Coordination Events as a method for bootstrapping local administration.",
                  "Expand the issuer and redeemer ecosystem through real-world operational use."
                ]
              },
              {
                heading: "Procedural Implementation",
                paragraphs: [
                  "The framework is intentionally procedural. It is structured so participating jurisdictions can demonstrate not only that the model can function, but that it can be reproduced. In that sense, the pilot operates as guidance infrastructure that establishes the conditions under which a new coordination layer becomes administratively viable.",
                  "The pilot is therefore not simply an experiment in app usage. It is a deployment sequence for showing how programmable coordination can enter real administrative routines through recognizable institutional pathways."
                ]
              },
              {
                heading: "Roles Within the Pilot",
                bullets: [
                  "Issuers: organizations that issue tasks expanding their non-private goods and services mission. Eligible issuers are incorporated public-service organizations with local service history and the capacity to manage a volunteer program, and they must adhere to governance mandates from representative issuer organizations.",
                  "Redeemers: organizations that offer access to goods and services. Eligible redeemers are incorporated public or private organizations willing to redeem access with civic credits, and they must adhere to governance mandates from representative redeemer organizations.",
                  "Civic Participants: individuals who claim and execute civic-labor opportunities provided by issuers. Eligible participants are any citizens or non-citizens capable of performing local tasks, and they must commit to governance mandates from representative issuer and redeemer organizations.",
                  "Validators: individuals or organizations capable of verifying the work performed by civic participants. Validators must commit to the governance mandates of their reporting issuer organization."
                ]
              },
              {

                paragraphs: [
                  "City/Sync is trying to solve a coordination problem. Cities already contain enormous amounts of civic effort, volunteering, mutual aid, and public-minded participation, but most institutions still struggle to recognize that effort, coordinate it, validate it, and build on it in durable ways.",
                  "The result is that public contribution remains fragmented. Organizations run separate systems, volunteer work is difficult to discover, recognition is inconsistent, and communities have few structured ways to turn civic energy into something operationally useful. City/Sync exists to make that capacity visible, governable, and easier to integrate into real public-sector workflows."
                ]
              },
              {
                heading: "Why use smart contracts and local chains at all?",
                paragraphs: [
                  "Smart contracts are used because City/Sync needs verifiable shared state around task issuance, verification, redemption, and governance. They allow key lifecycle events to be recorded in a way that is auditable and hard to manipulate after the fact, while keeping those records synchronized across roles.",
                  "Local chains matter because public institutions need systems that fit their legal, political, and administrative reality. City/Sync is optimized for adoptability inside government, not for ideological purity. A local chain is easier to align with compliance, procurement, institutional oversight, and long-term public trust than a system that depends on distant global governance."
                ]
              },
              {
                heading: "Is this legally and institutionally viable?",
                paragraphs: [
                  "That is one of the main reasons the pilot exists. City/Sync is being designed to function inside real institutions rather than around them. The documentation addresses liability structure, money transmission avoidance, regulatory optimization, governance procedures, and the administrative logic required for adoption.",
                  "The strongest answer is not abstract. It is procedural. The pilot is meant to generate the operational precedent, agreements, governance patterns, and compliance posture that show the model can function under real-world constraints. City/Sync is trying to become institutionally legible, not merely technically possible."
                ]
              },
              {
                heading: "Why is CITY non-transferable?",
                paragraphs: [
                  "CITY is non-transferable because it is intended to function as a civic credit, not as open-loop money. It is earned through verified contribution and then redeemed for access to approved offerings inside a governed local economy. Allowing unrestricted transfer would weaken that design and make the credit behave more like a general-purpose payment instrument.",
                  "Non-transferability also helps preserve the meaning of the system. The point is to recognize contribution and connect it to access, not to create a tradable asset detached from the civic activity that produced it. That structure supports both the economic design and the legal posture of the pilot."
                ]
              },
              {
                heading: "How does City/Sync fit into real governments and public institutions?",
                paragraphs: [
                  "City/Sync is designed to fit into existing institutions by extending their coordination capacity rather than forcing them to replace their entire operating model. Issuer Organizations can use it to structure and verify civic-labor tasks. Redeemer Organizations can use it to make underused capacity available through the protocol. Governance can be layered on top of real institutions and committees rather than invented from scratch.",
                  "This is why the project emphasizes onboarding logic, deployment models, local chains, and procurement legibility. The theory of change is recomposition, not disruption. City/Sync is meant to be adopted through recognizable institutional pathways so that participation infrastructure can become part of how cities actually operate."
                ]
              },
              {
                heading: "What would it take to bring City/Sync to another city?",
                paragraphs: [
                  "A new city needs more than technical access. It needs a workable local coalition: credible issuer organizations, redeemer organizations with real capacity, pilot governance support, and enough administrative openness to test a new coordination model under controlled conditions. The city also needs a deployment process that fits its own legal and institutional environment.",
                  "That is why the Pilot Program is focused on replication as much as demonstration. The goal is to produce a procedural artifact other cities can adopt and adapt. In practice, starting a pilot means aligning local institutions, defining the first deployment scope, and creating enough issuer and redeemer density for the civic-credit loop to function credibly from the beginning."
                ]
              },
              {
                heading: "What makes this better or more meaningful than ordinary volunteering alone?",
                paragraphs: [
                  "Ordinary volunteering is valuable, but it is often fragmented, poorly recognized, and disconnected from a larger system of coordination. City/Sync tries to make civic participation more durable by giving it structure, recognition, and a direct relationship to local institutions and offerings. It turns participation into something that can be tracked, validated, and built upon over time.",
                  "That makes the experience more meaningful in two ways. First, participants receive real access and recognition for their contribution instead of symbolic appreciation alone. Second, their effort becomes part of a broader public coordination system that helps institutions expand impact, improve responsiveness, and create more visible pathways for community contribution."
                ]
              },
              {
                heading: "How do Mass Coordination Events help coordinate public action and test governance?",
                paragraphs: [
                  "Mass Coordination Events, or MCEs, create time-bound moments in which multiple actors converge around a specific public goal. They allow the protocol to organize civic labor, issuer priorities, redemption pathways, and governance attention around one shared mission rather than leaving all activity diffuse and uncoordinated.",
                  "They are also useful governance tests. Because they have clear phases, shared objectives, and visible outcomes, they let the pilot observe how institutions make decisions, how participants respond to incentives, and how governance tools like VOTE and committee coordination perform under real operating pressure. In that sense, MCEs are both public action mechanisms and learning environments for the protocol."
                ]
              }
            ]
          }
        ]
      }
    ];

    function collectDocumentLinks(nodes) {
      const links = [];

      nodes.forEach(node => {
        if (Array.isArray(node.sections)) {
          links.push({ label: node.title, href: `#${node.id}` });
        }
        if (Array.isArray(node.children) && node.children.length > 0) {
          links.push(...collectDocumentLinks(node.children));
        }
      });

      return links;
    }

    const WELCOME_DOC = {
      id: "welcome",
      title: "Welcome",
      summary:
        "Start here to browse the full City/Sync documentation hub. Use the table of contents below to jump directly into the Foundation, Pilot Program, Protocol, Legal, or FAQ sections.",
      sections: [
        {
          heading: "Welcome to the Documentation Hub",
          paragraphs: [
            "This page is the main entry point for the City/Sync docs. It is organized around the five major sections of the project so readers can move between institutional context, pilot mechanics, protocol development, legal positioning, and frequently asked questions without having to guess where material lives.",
            "Use the grouped links below to jump directly to the page you want. The left navigation starts collapsed by default so the docs open cleanly, but you can expand any branch whenever you want to browse the full tree."
          ]
        },
        ...DOCS_TREE.map(node => ({
          heading: node.title,
          links: collectDocumentLinks(Array.isArray(node.children) && node.children.length > 0 ? node.children : [node]),
        })),
      ],
    };

    const state = {
      query: "",
      selectedId: WELCOME_DOC.id,
      expanded: new Set(),
    };

    const index = new Map();

    function walk(nodes, path = []) {
      nodes.forEach(node => {
        const nextPath = [...path, node];
        index.set(node.id, { node, path: nextPath });
        if (node.children?.length) {
          walk(node.children, nextPath);
        }
      });
    }

    walk(DOCS_TREE);
    index.set(WELCOME_DOC.id, { node: WELCOME_DOC, path: [WELCOME_DOC] });

    function firstDocumentId(nodes = DOCS_TREE) {
      for (const node of nodes) {
        if (Array.isArray(node.sections)) return node.id;
        if (node.children?.length) {
          const nested = firstDocumentId(node.children);
          if (nested) return nested;
        }
      }
      return "";
    }

    function expandPathForSelection(id) {
      const entry = index.get(id);
      if (!entry) return;

      entry.path.forEach(step => {
        if (Array.isArray(step.children) && step.children.length > 0) {
          state.expanded.add(step.id);
        }
      });
    }

    function scrollDocsToTop() {
      const target = document.querySelector(".docs-main");
      if (target && typeof target.scrollIntoView === "function") {
        target.scrollIntoView({ behavior: "auto", block: "start" });
        return;
      }

      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function includesText(value, query) {
      return String(value || "").toLowerCase().includes(query);
    }

    function collectSearchText(node) {
      const sectionText = (node.sections || [])
        .flatMap(section => [section.heading, ...(section.paragraphs || []), ...(section.bullets || [])])
        .join(" ");
      const keyText = (node.keywords || []).join(" ");
      return `${node.title || ""} ${node.summary || ""} ${sectionText} ${keyText}`.toLowerCase();
    }

    function matchesSubtree(node, query) {
      if (!query) return true;
      if (includesText(collectSearchText(node), query)) return true;
      return (node.children || []).some(child => matchesSubtree(child, query));
    }

    function toggleNode(id) {
      if (state.expanded.has(id)) {
        state.expanded.delete(id);
      } else {
        state.expanded.add(id);
      }
      renderTree();
    }

    function selectDocument(id, updateHash = true) {
      const entry = index.get(id);
      if (!entry) return;
      if (!Array.isArray(entry.node.sections)) return;

      state.selectedId = id;
      expandPathForSelection(id);
      renderTree();
      renderContent();
      requestAnimationFrame(scrollDocsToTop);

      if (updateHash) {
        if (id === WELCOME_DOC.id) {
          history.replaceState(null, "", window.location.pathname);
        } else {
          history.replaceState(null, "", `#${id}`);
        }
      }
    }

    function renderTree() {
      const tree = document.getElementById("doc-tree");
      tree.innerHTML = "";

      const query = state.query.trim().toLowerCase();

      function renderNode(node, depth) {
        if (!matchesSubtree(node, query)) return null;

        const hasChildren = Array.isArray(node.children) && node.children.length > 0;
        const isDoc = Array.isArray(node.sections);
        const isExpanded = query ? true : state.expanded.has(node.id);

        const wrap = document.createElement("div");
        wrap.className = "tree-node";

        const row = document.createElement("div");
        row.className = "tree-row";
        row.style.paddingLeft = `${depth * 12}px`;

        if (hasChildren) {
          const toggle = document.createElement("button");
          toggle.className = `tree-toggle${isExpanded ? " is-open" : ""}`;
          toggle.type = "button";
          toggle.setAttribute("aria-label", isExpanded ? `Collapse ${node.title}` : `Expand ${node.title}`);
          toggle.addEventListener("click", event => {
            event.stopPropagation();
            toggleNode(node.id);
          });
          row.appendChild(toggle);
        } else {
          const spacer = document.createElement("span");
          spacer.style.width = "22px";
          spacer.style.height = "22px";
          spacer.style.display = "inline-block";
          row.appendChild(spacer);
        }

        const label = document.createElement("button");
        label.type = "button";
        label.className = `tree-label${hasChildren ? " group" : ""}${state.selectedId === node.id ? " selected" : ""}`;
        label.textContent = node.title;

        if (isDoc) {
          label.addEventListener("click", () => selectDocument(node.id));
        } else if (hasChildren) {
          label.addEventListener("click", () => toggleNode(node.id));
        } else {
          label.disabled = true;
        }

        row.appendChild(label);
        wrap.appendChild(row);

        if (hasChildren && isExpanded) {
          const childrenWrap = document.createElement("div");
          childrenWrap.className = "tree-children";

          node.children.forEach(child => {
            const childNode = renderNode(child, depth + 1);
            if (childNode) childrenWrap.appendChild(childNode);
          });

          if (childrenWrap.childElementCount > 0) {
            wrap.appendChild(childrenWrap);
          }
        }

        return wrap;
      }

      DOCS_TREE.forEach(node => {
        const element = renderNode(node, 0);
        if (element) tree.appendChild(element);
      });

      if (!tree.childElementCount) {
        const none = document.createElement("div");
        none.className = "no-results";
        none.textContent = "No matching documentation topics found.";
        tree.appendChild(none);
      }
    }

    function renderContent() {
      const entry = index.get(state.selectedId);
      if (!entry) return;

      const { node, path } = entry;
      const docPath = document.getElementById("doc-path");
      const docTitle = document.getElementById("doc-title");
      const docSummary = document.getElementById("doc-summary");
      const docContent = document.getElementById("doc-content");

      const pathTitles = path.map(step => step.title);
      docPath.textContent = `Documentation / ${pathTitles.join(" / ")}`;
      docTitle.textContent = node.title;
      docSummary.textContent = node.summary || "";

      docContent.innerHTML = "";
      docContent.classList.toggle("cards-layout", node.sectionLayout === "cards");

      (node.sections || []).forEach(section => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "doc-section";

        const heading = document.createElement("h3");
        heading.textContent = section.heading;
        sectionEl.appendChild(heading);

        (section.paragraphs || []).forEach(text => {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          sectionEl.appendChild(paragraph);
        });

        if (Array.isArray(section.bullets) && section.bullets.length > 0) {
          const list = document.createElement("ul");
          list.className = "doc-list";

          section.bullets.forEach(item => {
            const listItem = document.createElement("li");
            const text = document.createElement("span");
            text.textContent = item;
            listItem.appendChild(text);
            list.appendChild(listItem);
          });

          sectionEl.appendChild(list);
        }

        if (Array.isArray(section.links) && section.links.length > 0) {
          const linkList = document.createElement("ul");
          linkList.className = "doc-link-list";

          section.links.forEach(item => {
            const listItem = document.createElement("li");
            const link = document.createElement("a");
            link.href = item.href;
            link.textContent = item.label;
            listItem.appendChild(link);
            linkList.appendChild(listItem);
          });

          sectionEl.appendChild(linkList);
        }

        docContent.appendChild(sectionEl);
      });

      if (Array.isArray(node.pageLinks) && node.pageLinks.length > 0) {
        const actions = document.createElement("div");
        actions.className = "doc-actions";

        node.pageLinks.forEach(link => {
          const action = document.createElement("a");
          action.className = "doc-action-btn";
          action.href = link.href;
          action.target = "_blank";
          action.rel = "noopener noreferrer";
          action.textContent = link.label;
          actions.appendChild(action);
        });

        docContent.appendChild(actions);
      }
    }

    function initSelection() {
      const hashId = decodeURIComponent(window.location.hash.replace("#", "")).trim();
      const hashEntry = index.get(hashId);
      if (hashEntry && Array.isArray(hashEntry.node.sections)) {
        state.selectedId = hashId;
        expandPathForSelection(hashId);
      } else {
        state.selectedId = WELCOME_DOC.id;
      }
    }

    function bindEvents() {
      const search = document.getElementById("doc-search");
      search.addEventListener("input", event => {
        state.query = event.target.value || "";
        renderTree();
      });
    }

    initSelection();
    bindEvents();
    renderTree();
    renderContent();

    window.addEventListener("hashchange", () => {
      const hashId = decodeURIComponent(window.location.hash.replace("#", "")).trim();
      if (!hashId) {
        state.selectedId = WELCOME_DOC.id;
        renderTree();
        renderContent();
        requestAnimationFrame(scrollDocsToTop);
        return;
      }
      const entry = index.get(hashId);
      if (entry && Array.isArray(entry.node.sections)) {
        state.selectedId = hashId;
        expandPathForSelection(hashId);
        renderTree();
        renderContent();
        requestAnimationFrame(scrollDocsToTop);
      }
    });
  </script>
</body>
</html>
