<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyCity gold and white logo</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f7f3;background:#173b31}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 82% 18%,#416755 0,transparent 30%),linear-gradient(145deg,#173b31,#294f40 55%,#1c3e34)}main{width:min(1080px,calc(100% - 40px));margin:auto;padding:72px 0}.eyebrow{color:#dd9e33;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.stage{display:grid;place-items:center;min-height:370px;margin-top:22px;padding:56px;border:1px solid #ffffff24;border-radius:26px;background:#183c32aa;box-shadow:0 30px 80px #071d1744,inset 0 1px #ffffff1a}.stage img{display:block;width:min(680px,100%);height:auto}.details{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;margin-top:30px}.details h1{margin:0 0 10px;font-size:clamp(30px,5vw,52px);letter-spacing:-.045em}.details p{max-width:660px;margin:0;color:#d8e2dc;line-height:1.7}.swatches{display:flex;gap:12px}.swatch{width:104px;padding:12px;border:1px solid #ffffff24;border-radius:14px;background:#ffffff0d;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.swatch i{display:block;height:32px;margin-bottom:9px;border-radius:7px}.swatch.gold i{background:#dd9e33}.swatch.white i{background:#f6f7f3}@media(max-width:700px){main{padding:38px 0}.stage{min-height:260px;padding:28px}.details{grid-template-columns:1fr}.swatches{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">MyCity · Color study</span>
    <section class="stage"><img src="./mycity-wordmark-gold-white.svg" alt="MyCity logo with my in gold and city in white"></section>
    <section class="details">
      <div><h1>Gold “my.” White “city.”</h1><p>The neighborhood-block mark stays white around the brand-gold point. The wordmark uses the same gold for “my” and the existing warm white for “city.”</p></div>
      <div class="swatches" aria-label="Logo colors"><span class="swatch gold"><i></i>#DD9E33</span><span class="swatch white"><i></i>#F6F7F3</span></div>
    </section>
  </main>
</body>
</html>
