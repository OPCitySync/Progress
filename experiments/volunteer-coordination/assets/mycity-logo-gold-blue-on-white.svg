<svg xmlns="http://www.w3.org/2000/svg" width="450" height="128" viewBox="0 0 450 128" role="img" aria-labelledby="title description">
  <title id="title">MyCity gold and Brand Blue logo on white</title>
  <desc id="description">Neighborhood block symbol with Brand Blue blocks and a brand-gold center point, followed by lowercase my in gold and city in Brand Blue, on a white background.</desc>
  <rect width="450" height="128" fill="#FFFFFF"/>
  <g aria-hidden="true">
    <rect x="21" y="21" width="31" height="25" rx="5" fill="#15151E"/>
    <rect x="59" y="21" width="48" height="25" rx="5" fill="#15151E"/>
    <rect x="21" y="53" width="31" height="22" rx="5" fill="#15151E"/>
    <rect x="21" y="82" width="31" height="25" rx="5" fill="#15151E"/>
    <rect x="59" y="82" width="48" height="25" rx="5" fill="#15151E"/>
    <circle cx="89" cy="64" r="10" fill="#DD9E33"/>
  </g>
  <text x="149" y="99" fill="#DD9E33" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-5">my<tspan fill="#15151E">city</tspan></text>
</svg>
